name: Windows 回归测试

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 安装界面依赖
        run: python -m pip install -r requirements.txt
      - name: 运行单元与回归测试
        run: python -B -X utf8 -m unittest discover -s tests -t . -v
